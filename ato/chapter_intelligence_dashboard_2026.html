<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Intelligence Dashboard | Alpha Tau Omega</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--night:#0d2137;--gold:#FFAE3B;--bg:#f2f5f9;--surface:#fff;--border:#dde4ef;--ink:#2D2C2C;--ink2:#4a5a72;--z-base:#FFAE3B;--z-tm:#0072B2;--z-fail:#D55E00;--orange:#D55E00;--orange-soft:#fdf0e6;--green:#1a7a5e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;}
.header{background:var(--night);padding:20px 36px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:100;}
.header-left{display:flex;align-items:center;gap:18px;}
.header img{height:38px;}
.header-title{font-family:"DM Serif Display",serif;color:#fff;font-size:1.2rem;}
.header-meta{color:var(--gold);font-size:0.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:3px;}
.select-wrap{display:flex;align-items:center;gap:10px;}
.select-label{color:rgba(255,255,255,0.6);font-size:0.8rem;}
.chapter-select{background:#1e3a5a;border:1px solid #3a5f80;color:#fff;font-family:"DM Sans",sans-serif;font-size:0.9rem;font-weight:500;padding:9px 16px;border-radius:6px;cursor:pointer;min-width:220px;}
.container{max-width:1280px;margin:0 auto;padding:28px 28px 60px;}
.score-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.score-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 22px;display:flex;align-items:center;gap:20px;}
.score-info{flex:1;}
.score-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.score-label.closure{color:var(--orange);}
.score-label.tm{color:var(--z-tm);}
.score-num{font-family:"DM Serif Display",serif;font-size:2.2rem;line-height:1;}
.score-num.closure{color:var(--orange);}
.score-num.tm{color:var(--z-tm);}
.score-sub{font-size:11px;color:var(--ink2);margin-top:4px;line-height:1.5;}
.score-context{font-size:10.5px;margin-top:7px;padding-top:7px;border-top:1px solid var(--border);color:var(--ink2);}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
.stat-label{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px;}
.stat-value{font-family:"DM Serif Display",serif;font-size:1.65rem;color:var(--night);line-height:1;}
.stat-value.flag{color:var(--orange);}
.stat-value.good{color:var(--green);}
.stat-sub{font-size:10px;color:var(--ink2);margin-top:3px;}
.src{display:inline-flex;align-items:center;font-size:8px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0;letter-spacing:.03em;}
.s-cos{background:rgba(0,0,0,0.55);color:#fff;}
.s-db{background:#3d1f8a;color:#ddd;}
.s-ipeds{background:#0d2f5c;color:#c8dcf5;}
.s-fgi{background:#084a36;color:#a8e0cb;}
.s-hs{background:#7a3500;color:#ffd5a0;}
.s-pd{background:#6a0f0f;color:#ffbbbb;}
.s-incident{background:#4a004a;color:#f5b8f5;}
.zone-section{margin-bottom:20px;}
.zone-hdr{border-radius:10px;padding:13px 20px;margin-bottom:14px;display:flex;align-items:center;gap:14px;}
.zh-base{background:var(--z-base);}
.zh-fail{background:var(--z-fail);}
.zone-tag{font-size:9px;font-weight:700;padding:2px 9px;border-radius:20px;background:rgba(0,0,0,0.2);color:#fff;letter-spacing:.06em;white-space:nowrap;flex-shrink:0;}
.zone-hdr-text h2{font-family:"DM Serif Display",serif;font-size:1.1rem;color:#fff;}
.zone-hdr-text p{font-size:0.77rem;color:rgba(255,255,255,0.82);margin-top:2px;}
.indicator-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ind-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 13px;display:flex;flex-direction:column;gap:5px;}
.ind-card.flagged{border-left:3px solid var(--orange);background:#fffaf7;}
.ind-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.ind-name{font-weight:600;font-size:0.82rem;color:var(--night);flex:1;line-height:1.3;}
.ind-value{font-family:"DM Serif Display",serif;font-size:1.15rem;flex-shrink:0;}
.ind-value.flag{color:var(--orange);}
.ind-value.ok{color:var(--green);}
.ind-value.na{color:var(--ink2);font-size:0.82rem;font-family:"DM Sans",sans-serif;font-style:italic;}
.ind-desc{font-size:0.76rem;color:var(--ink2);line-height:1.45;flex:1;}
.ind-bench{display:flex;gap:10px;flex-wrap:wrap;}
.bench-item{font-size:9px;color:var(--ink2);display:flex;align-items:center;gap:4px;}
.bench-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.bd-open{background:var(--green);}
.bd-close{background:var(--orange);}
.ind-footer{display:flex;justify-content:flex-end;}
.incidents-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 22px;margin-bottom:16px;}
.section-title{font-family:"DM Serif Display",serif;font-size:1.05rem;color:var(--night);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.inc-table{width:100%;border-collapse:collapse;font-size:0.79rem;}
.inc-table th{text-align:left;font-size:0.67rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);border-bottom:2px solid var(--border);padding:5px 10px;white-space:nowrap;}
.inc-table td{padding:7px 10px;border-bottom:0.5px solid var(--border);vertical-align:top;line-height:1.4;}
.inc-table tr:last-child td{border-bottom:none;}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.badge-closed{background:#e8f7ec;color:#1a5c2a;}
.badge-open{background:var(--orange-soft);color:#7a2700;}
.badge-eval{background:#fdf3d6;color:#7a5000;}
.no-incidents{font-size:0.85rem;color:var(--ink2);font-style:italic;}
.context-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 22px;margin-bottom:20px;}
.context-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.context-col h4{font-size:0.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px;}
.context-bullet{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:0.81rem;color:var(--ink);line-height:1.5;}
.context-bullet:last-child{border-bottom:none;}
.context-bullet.warn{color:#7a2700;background:#fffaf7;border-radius:4px;padding:7px 10px;border:0.5px solid #f5c8a8 !important;margin-bottom:4px;}
.cb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px;}
.cb-dot.norm{background:var(--ink2);}
.cb-dot.warn{background:var(--orange);}
.cb-text{flex:1;}
.cb-src{margin-left:8px;flex-shrink:0;}
.page-footer{text-align:right;font-size:0.71rem;color:#8a9ab8;padding:14px 0;border-top:1px solid var(--border);margin-top:28px;}
@media(max-width:1000px){.stats-row{grid-template-columns:repeat(2,1fr);}.indicator-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.score-row,.context-grid{grid-template-columns:1fr;}.container{padding:16px 16px 44px;}.header{padding:14px 16px;flex-direction:column;gap:12px;}}
</style>
</head>

];
const FAILURE_DEFS=[
  {key:'Members in Campus Orgs',desc:'Members hold membership in other campus organizations. Absence signals social isolation and precedes decline.',open:0.99,close:0.80,typ:'yn'},
  {key:'Budget Prepared Each Term',desc:'Formal budget produced at semester start. One of the earliest visible signs of organizational deterioration when absent.',open:1.00,close:0.83,typ:'yn'},

  {key:'Annual Report to NHQ',desc:'Annual report and awards application submitted on schedule. Missing this signals NHQ disengagement.',open:0.94,close:0.67,typ:'yn'},
  {key:'H&S Compliance Form',desc:'Required H&S compliance form submitted on schedule. Non-submission creates institutional exposure.',open:0.96,close:0.73,typ:'yn'},
  {key:'Minutes to NHQ',desc:'Chapter meeting minutes forwarded to NHQ each term. Sharpest single divider between closing and open chapters.',open:0.33,close:0.03,typ:'yn'},
  {key:'Minutes to BOT',desc:'Chapter meeting minutes forwarded to the Board of Trustees. Only 16% of closing chapters do this vs 45% open.',open:0.45,close:0.16,typ:'yn'},
  {key:'New Members Voting Rights',desc:'Newly initiated members receive full voting rights immediately. Absence signals governance breakdown.',open:0.97,close:0.80,typ:'yn'},

];

// Option 2: gauge color driven by failure flag count, not score
function gaugeColor(flags){
  if(flags===0) return '#6b7a99';       // no flags: neutral gray
  if(flags<=2)  return '#D4820A';       // 1-2 flags: amber
  return '#D55E00';                      // 3+ flags: orange
}

function gaugeArc(score,color,size=90){
  const r=size*0.4,cx=size/2,cy=size/2;
  const circ=2*Math.PI*r,offset=circ*(1-score/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eee" stroke-width="9"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+6}" text-anchor="middle" font-family="DM Serif Display,serif"
      font-size="${size*0.2}" fill="${color}">${Math.round(score)}</text></svg>`;
}

function srcPill(t){
  const m={cos:'<span class="src s-cos">COS</span>',db:'<span class="src s-db">Database</span>',
    ipeds:'<span class="src s-ipeds">IPEDS</span>',fgi:'<span class="src s-fgi">FGI</span>',
    hs:'<span class="src s-hs">H&amp;S Rate</span>',pd:'<span class="src s-pd">Past Due</span>',
    incident:'<span class="src s-incident">Incident Log</span>'};
  return m[t]||'';
}

function fmtVal(val,typ){
  if(val===null||val===undefined)return{display:'No data',cls:'na'};
  if(typ==='yn'){
    if(val>=0.99)return{display:'Yes',cls:'ok'};
    if(val<=0.01)return{display:'No',cls:'flag'};
    return{display:'Partial',cls:'flag'};
  }
  if(typ==='yn_inv'){
    if(val>=0.99)return{display:'Yes',cls:'flag'};
    if(val<=0.01)return{display:'No',cls:'ok'};
    return{display:'Partial',cls:'flag'};
  }
  return{display:Math.round(val),cls:'ok'};
}

function isFlagged(val,typ,openB,closeB){
  if(val===null||val===undefined)return true;
  if(typ==='yn')return val<0.75;
  if(typ==='yn_inv')return val>0;
  if(typ==='num'){const mid=(openB+closeB)/2;return val<=mid;}
  return false;
}

function benchFmt(val,typ){
  return(typ==='yn'||typ==='yn_inv')?Math.round(val*100)+'%':val.toFixed(1);
}

function renderIndicators(defs,vals){
  return defs.map(def=>{
    const val=vals[def.key];
    const flagged=isFlagged(val,def.typ,def.open,def.close);
    const {display,cls}=fmtVal(val,def.typ);
    return `<div class="ind-card ${flagged?'flagged':''}">
      <div class="ind-top"><div class="ind-name">${def.key}</div>
        <div class="ind-value ${cls}">${display}</div></div>
      <div class="ind-desc">${def.desc}</div>
      <div class="ind-bench">
        <div class="bench-item"><span class="bench-dot bd-open"></span>Open: ${benchFmt(def.open,def.typ)}</div>
        <div class="bench-item"><span class="bench-dot bd-close"></span>Closing: ${benchFmt(def.close,def.typ)}</div>
      </div>
      <div class="ind-footer"><span class="src s-cos">COS</span></div>
    </div>`;
  }).join('');
}

function renderIncidents(ch){
  const rows=(PROFILES[ch]||{}).incidents||[];
  if(!rows.length)return'<div class="no-incidents">No incidents recorded in 2025-26.</div>';
  const statusBadge=s=>s==='Closed'?'badge-closed':s==='Evaluation'?'badge-eval':'badge-open';
  const trs=rows.map(r=>{
    const vt=r['Violation Type']&&r['Violation Type']!==''?r['Violation Type']:'<em style="color:var(--ink2)">Not specified</em>';
    const out=r['Outcome']||'&mdash;';
    const san=r['Sanction']||'&mdash;';
    const mem=r['Member']||'&mdash;';
    return `<tr><td>${r['Incident Number']}</td><td>${r['Incident: Incident Name']}</td>
      <td>${vt}</td><td>${r['Responsible for Violation']||'&mdash;'}</td>
      <td>${out}</td><td>${r['Incident Date']||'&mdash;'}</td>
      <td><span class="badge ${statusBadge(r['Status'])}">${r['Status']}</span></td>
      <td>${san}</td></tr>`;
  }).join('');
  return `<table class="inc-table"><thead><tr>
    <th>Incident #</th><th>Name</th><th>Violation Type</th>
    <th>Responsible</th><th>Outcome</th><th>Date</th><th>Status</th><th>Sanction</th>
  </tr></thead><tbody>${trs}</tbody></table>`;
}

function renderContext(ch){
  const ctx=CONTEXT[ch];if(!ctx)return'';
  const col=bullets=>bullets.map(b=>{
    const text=b[0],src=b[1],warn=b[2]===true;
    return `<div class="context-bullet ${warn?'warn':''}">
      <span class="cb-dot ${warn?'warn':'norm'}"></span>
      <span class="cb-text">${text}</span>
      <span class="cb-src">${srcPill(src)}</span></div>`;
  }).join('');
  return `<div class="context-grid">
    <div class="context-col"><h4>Campus Profile</h4>${col(ctx.campus)}</div>
    <div class="context-col"><h4>Chapter Profile</h4>${col(ctx.chapter)}</div>
  </div>`;
}

function fmtCur(n){
  if(n===null||n===undefined)return'N/A';
  return'$'+Math.round(n).toLocaleString();
}

function loadChapter(name){
  const p=PROFILES[name];if(!p)return;
  const flags=p.failure_flags||0;
  const clColor=gaugeColor(flags);
  const tmColor='#0072B2';
  const clLabel=p.cl_rank<=20?'High risk':p.cl_rank<=60?'Moderate risk':'Low risk';
  const flagNote=flags===0?'No active failure flags':flags===1?'1 failure flag':flags+' failure flags';
  const rp=p.retention!==null&&p.retention!==undefined?Math.round(p.retention*100):null;
  const retCls=rp===null?'':(rp>=75&&rp<=95)?'good':(rp<50||rp>97)?'flag':'';
  const retD=rp!==null?rp+'%':'N/A';
  const pdCls=p.past_due>15000?'flag':p.past_due>5000?'':'good';
  const tmNote=p.tm_2425
    ?`Won 2024-25 &nbsp;&middot;&nbsp; ${p.tm_recent5} of last 5 yrs &nbsp;&middot;&nbsp; ${p.tm_alltime} all-time`
    :`Not won 2024-25 &nbsp;&middot;&nbsp; ${p.tm_recent5} of last 5 yrs &nbsp;&middot;&nbsp; ${p.tm_alltime} all-time`;
  const pledgeNote=p.n_pledges>0
    ?`${p.n_pledges} pledged &nbsp;&middot;&nbsp; ${p.n_depledged} depledged`
    :'No pledge data';

  document.getElementById('dashContainer').innerHTML=`
    <div class="score-row">
      <div class="score-card">
        <div>${gaugeArc(p.closure_scaled,clColor)}</div>
        <div class="score-info">
          <div class="score-label closure">Closure Risk Score</div>
          <div class="score-num" style="color:${clColor}">${p.closure_scaled}<span style="font-size:1rem"> / 100</span></div>
          <div class="score-sub">Rank ${p.cl_rank} of 128 &nbsp;&middot;&nbsp; ${clLabel} &nbsp;&middot;&nbsp; ${flagNote}</div>
          <div class="score-context">0 = no risk &nbsp;&middot;&nbsp; 100 = highest risk &nbsp;&middot;&nbsp; Network median = ${CONSTANTS.network_median_closure} &nbsp;&middot;&nbsp; Gauge color reflects active flags</div>
        </div>
      </div>
      <div class="score-card">
        <div>${gaugeArc(p.tm_scaled,tmColor)}</div>
        <div class="score-info">
          <div class="score-label tm">True Merit Score</div>
          <div class="score-num tm">${p.tm_scaled}<span style="font-size:1rem"> / 100</span></div>
          <div class="score-sub">Rank ${p.tm_rank} of 128 &nbsp;&middot;&nbsp; ${tmNote}</div>
          <div class="score-context">0 = furthest from TM &nbsp;&middot;&nbsp; 100 = strongest profile &nbsp;&middot;&nbsp; Median = ${CONSTANTS.network_median_tm} &nbsp;&middot;&nbsp; Prior TM avg = ${CONSTANTS.prior_tm_avg}</div>
        </div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Chapter Size (June 2026)</div>
        <div class="stat-value ${p.ug_size>=100?'good':p.ug_size<30?'flag':''}">${p.ug_size}</div>
        <div class="stat-sub">Initiated members</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pledge Class 2025-26</div>
        <div class="stat-value">${p.n_pledges}</div>
        <div class="stat-sub">${pledgeNote}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pledge Retention</div>
        <div class="stat-value ${retCls}">${retD}</div>
        <div class="stat-sub">Target 75&ndash;90%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Current Past Due</div>
        <div class="stat-value ${pdCls}">${fmtCur(p.past_due)}</div>
        <div class="stat-sub">As of June 2026</div>
      </div>
    </div>
    <div class="zone-section">
      <div class="zone-hdr zh-base"><span class="zone-tag">Zone 1</span>
        <div class="zone-hdr-text"><h2>Baseline Operations</h2>
          <p>Foundational behaviors predicting both True Merit and closure. Orange = closure concern.</p></div>
      </div>
      <div class="indicator-grid">${renderIndicators(BASELINE_DEFS,p.baseline)}</div>
    </div>
    <div class="zone-section">
      <div class="zone-hdr zh-fail"><span class="zone-tag">Zone 3</span>
        <div class="zone-hdr-text"><h2>Chapter Failure Metrics</h2>
          <p>Indicators that specifically predict chapter closure. Orange = staff action required.</p></div>
      </div>
      <div class="indicator-grid">${renderIndicators(FAILURE_DEFS,p.failure)}</div>
    </div>
    <div class="incidents-section">
      <div class="section-title">2025-26 Incidents <span class="src s-incident">Incident Log</span></div>
      ${renderIncidents(name)}
    </div>
    <div class="context-section">
      <div class="section-title">Campus &amp; Chapter Context</div>
      ${renderContext(name)}
    </div>
    <div class="page-footer">Alpha Tau Omega &nbsp;&middot;&nbsp; Chapter Intelligence Dashboard &nbsp;&middot;&nbsp; 2025-26 &nbsp;&middot;&nbsp; Chris Smith</div>
  `;
}
loadChapter(document.getElementById('chapterSelect').value);
</script>
